## <a id="三"></a>三、认错纠错：通讯突破箱体不破，趋势判断需动态修正

### 3.1 用户的核心反思

> "最关键的是昨天通讯突破箱体了，今天也没有跌破，看来之前的判断是错的，于是选择在尾盘买回来部分，趋势看错了，就要认，犟嘴是没用的。"

这是本次复盘最有价值的一段话，体现了成熟的交易纪律。

### 3.2 通讯ETF的技术验证

**8/17（周一）**：通讯ETF(515050)收盘 **1.117**，突破前期箱体上沿（约1.10）
**8/18（周二）**：收盘 **1.101**（-1.43%），最低1.081，但**没有跌破箱体上沿**

| 指标 | 8/17 | 8/18 | 判断 |
|------|:---:|:---:|------|
| 收盘 | 1.117 | 1.101 | 冲高回落 |
| 最低 | — | 1.081 | 回踩箱体上沿 |
| 箱体上沿 | ~1.10 | ~1.10 | **未跌破** ✅ |
| 前收 | 1.074 | 1.117 | — |

**关键判断**：
- 8/17突破箱体（1.10）后，8/18回踩最低1.081，但仍站在箱体上沿上方
- "突破不破"是趋势延续的确认信号——如果突破后能站稳箱体上沿，说明突破有效
- 用户之前的判断（减仓通讯）基于"FCC禁令→估值折价"，但市场用突破箱体的走势证明"光模块的景气逻辑强于政治风险折价"

### 3.3 认错纠错的交易纪律

> **"趋势看错了，就要认，犟嘴是没用的"——这是交易中最难也最重要的品质。**

| 维度 | 分析 |
|------|------|
| 之前的判断 | FCC禁令→CPO估值折价→减仓通讯 |
| 市场实际 | 通讯ETF突破箱体，CPO中际重回千元 |
| 纠错动作 | 尾盘买回部分通讯 |
| 纠错质量 | 右侧确认后纠错，而非情绪化追涨 |

**教训与启示**：
1. **基本面判断要尊重技术面确认**：FCC禁令的"估值折价"逻辑是合理的，但市场的实际走势（突破箱体）更权威
2. **右侧纠错优于左侧死扛**：发现趋势判断错误后，及时买回部分，而非"犟嘴"
3. **仓位管理是纠错的底气**：之前是"减仓"而非"清仓"，保留了纠错的灵活性

### 3.4 通讯ETF后续

| 维度 | 分析 |
|------|------|
| 技术面 | 突破箱体不破，趋势向上 |
| 压力位 | 1.12-1.14（前高） |
| 支撑位 | 1.08-1.10（箱体上沿） |
| 逻辑 | CPO景气逻辑 vs FCC风险折价，前者暂时占优 |
