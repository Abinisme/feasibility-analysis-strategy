**业绩如此亮眼，但市场"没选择原谅"**——用户观察到的核心矛盾：

| 质疑点 | 分析 |
|------|------|
| **延后披露** | 中报预约8/28披露（法定截止日前段末尾），且全程未发业绩预告，市场质疑"刻意延后" |

**8/21以来累计跌幅**：391.15→368.50（**-5.8%**），连续阴跌

### 4.2 下跌的深层逻辑

| 维度 | 分析 |
|------|------|
| **业绩预告临近** | 中报业绩预告即将发布，市场提前"用脚投票" |
| **行业竞争** | 锂价下跌+产能过剩+价格战担忧 |
| **资金抛弃** | 主线在AI/科技/防御，新能源被持续抽血 |

### 4.3 业绩预告的两种情景

| 情景 | 表现 | 概率 |

| **业绩不及预期** | 预告日继续下跌，考验360 | 偏高 |

> **"缺德时代"的困境**：宁德作为创业板第一权重，业绩预告前的阴跌持续拖累创业板。用户持仓中"工具人"角色（此前带动创业板）在弱市中反而成为拖累。**核心问题：新能源不在当前主线，任何利好都难以推动反弹。**

## <a id="五"></a>五、胜宏科技"业绩好却没人原谅" vs 沪电"瑟瑟发抖"

### 5.1 胜宏科技：业绩炸裂却遭弃

| 指标 | 2026H1 | 表现 |
|------|:---:|:---:|
| 营收 | 116.29亿 | +28.77% |
| 归母净利 | **28.57亿** | +33.30% |
| Q2单季 | 15.68亿 | 环比+21% |
| 经营现金流 | 29.11亿 | 大幅改善 |

**市场为何"不原谅"**：
1. **延后披露疑云**：预约8/28披露（截至日前末尾），未发业绩预告，市场质疑"刻意延后"→ 疑虑已price-in
2. **利好兑现**：业绩落地=利好出尽，前期涨幅已被price-in
3. **无前瞻超预期**：对比北方华创（合同负债+26.6%的备货超预期），胜宏只有当期业绩、无前瞻亮点

### 5.2 沪电"瑟瑟发抖"的原因

用户说"沪电股份瑟瑟发抖"——担心沪电步胜宏后尘：

| 维度 | 胜宏科技 | 沪电股份 |
|------|:---:|:---:|
| 中报 | 已披露（8/27晚） | 待披露 |
| 业绩 | 净利28.57亿（+33.3%） | 待验证 |
| 市场反应 | 利好出尽遭弃 | 恐慌等待 |
| 风险 | 业绩兑现日下跌 | 若披露后无超预期前瞻→可能补跌 |

**沪电8/28表现**：121.70（-0.26%），盘中最高127.64（+4.6%）后回落，**"瑟瑟发抖"的走势**——盘中一度冲高127.64，但担心步胜宏后尘，尾盘回落。

### 5.3 对比北方华创：什么是"被原谅"的关键

| 标的 | 当期业绩 | 前瞻指标 | 市场反应 |
|------|:---:|:---:|:---:|
| 北方华创 | 增收不增利（+5%） | **备货超预期（合同负债+26.6%）** | ✅ 被原谅（+2.47%） |
| 胜宏科技 | 高增长（+33%） | **无前瞻亮点** | ❌ 被弃 |

> **核心结论**：机构定价的"原谅"标准是**前瞻指标（预期差）**而非当期业绩。有备货/订单等前瞻超预期的被原谅（北方华创），只有当期业绩兑现的利好出尽（胜宏）。**沪电若中报只有当期业绩而无前瞻超预期，可能重蹈胜宏覆辙。**
