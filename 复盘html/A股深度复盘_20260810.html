### 4.2 买回中际旭创的逻辑验证

> **正向逻辑（支持买入）**：
> 1. 20倍Forward PE，800多不算贵（相比110x峰值已大幅压缩）
> 2. FCC禁令"落地难度大"共识形成→最恐慌阶段可能已过
> 3. 五连跌后（8/4高点1,022→8/10低点835，-18.3%），技术性超卖
> 4. "小部分买回"而非重仓，风险可控
>
> **反向风险（需要警惕）**：
> 1. 五日换手25%，筹码结构恶化，上方套牢盘沉重
> 2. 今日跌破880支撑，技术上打开了向800-820的下行空间
> 3. FCC正式文件时间表仍悬而未决

> **操作评价：这是一个"防守型战术配置"，不是"看多CPO"。** 核心目的是：①在极端估值区间保留CPO敞口，防止光模块因某种催化（如禁令搁置）出现大波段反弹而完全踏空；②仓位控制（小部分）体现风险意识。与"减仓通讯ETF换恒生科技"的主策略并不矛盾。

### 4.3 大幅加仓创业50ETF的逻辑验证

| 维度 | 分析 |
|------|------|
| **为什么是创业50** | 覆盖创业板核心权重（宁德/东方财富/医药/科技），与通讯ETF有部分交叉但更分散 |
| **与通讯ETF的关系** | 通讯ETF成分偏CPO/5G→FCC直接冲击；创业50偏综合→风险更分散 |
| **今日时点** | 创业板跌2.18%后加仓，属于"逆向买入" |
| **逻辑** | 看好创业板中长期趋势，短期CPO拖累提供了折扣入场机会 |

> **操作评价：方向正确。** 创业50ETF相比通讯ETF更分散、更综合，FCC冲击对其影响更小。在创业板大跌日加仓是逆向投资的合理操作。
